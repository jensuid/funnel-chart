name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:lib
      - name: Verify package contents
        run: |
          test -f dist/funnel-chart.js
          test -f dist/funnel-chart.cjs
          test -f dist/funnel-chart.css
          test -f dist/lib/index.d.ts
          pnpm pack --dry-run

  # PUBLISH — disiapkan tapi NONAKTIF sampai owner siap:
  # 1. Set secret NPM_TOKEN di repo settings (automation token).
  # 2. Set `private: false` di package.json.
  # 3. Perbaiki `repository.url` di package.json.
  # 4. Tag & push: git tag v0.1.0 && git push origin v0.1.0
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish # butuh approval environment di GitHub Settings
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - run: pnpm install --frozen-lockfile
      - run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
